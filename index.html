<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d1b">
  <title>El globo sorpresa</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #100d1b;
      color: #fff8ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, #38234f 0, transparent 43%),
        radial-gradient(ellipse at 50% 100%, #20172f 0, transparent 55%),
        #100d1b;
    }

    main {
      width: min(100% - 32px, 620px);
      min-height: 560px;
      display: grid;
      justify-items: center;
      align-content: center;
      text-align: center;
      position: relative;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      letter-spacing: -.04em;
    }

    .instruction {
      margin: 0;
      color: #c2b4d1;
    }

    .stage {
      height: 310px;
      width: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    .balloon-wrap {
      position: relative;
      width: 180px;
      height: 225px;
      display: grid;
      place-items: center;
      transform-origin: 50% 85%;
      animation: sway 2.2s ease-in-out infinite alternate;
    }

    .balloon {
      position: relative;
      width: 132px;
      height: 158px;
      border-radius: 50% 50% 47% 47% / 43% 43% 57% 57%;
      transform: scale(.08);
      background:
        radial-gradient(ellipse at 31% 24%, #fff8 0 3%, #ffffff30 4% 11%, transparent 31%),
        radial-gradient(ellipse at 37% 28%, #ffb8e1 0, #ff4da1 32%, #d71373 74%, #8e0b55 100%);
      box-shadow: inset -13px -17px 22px #560b443d, 0 16px 40px #fa32904a;
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 16px;
      bottom: -8px;
      left: calc(50% - 9px);
      background: #c4156d;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .string {
      position: absolute;
      width: 2px;
      height: 75px;
      top: calc(50% + 77px);
      left: calc(50% - 1px);
      border-radius: 50%;
      background: linear-gradient(#f5d8ed, #a992b2);
      transform: scaleY(0);
      transform-origin: top;
    }

    .balloon-wrap.inflating .balloon {
      animation: inflate 4.2s cubic-bezier(.2, .75, .25, 1) forwards;
    }

    .balloon-wrap.inflating .string {
      animation: string-grow 4.2s ease-out forwards;
    }

    .balloon-wrap.popped {
      animation: none;
    }

    .balloon-wrap.popped .balloon,
    .balloon-wrap.popped .string {
      display: none;
    }

    .pop-flash {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 3px solid #ffe7a1;
      border-radius: 50%;
      opacity: 0;
      transform: scale(.1);
    }

    .popped .pop-flash {
      animation: pop 550ms ease-out forwards;
    }

    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .confetti i {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      background: var(--color);
      opacity: 0;
    }

    .popped .confetti i {
      animation: confetti 850ms cubic-bezier(.12, .65, .25, 1) forwards;
      animation-delay: var(--delay);
    }

    .message {
      position: absolute;
      width: min(100%, 400px);
      top: 55%;
      font-size: clamp(2.7rem, 11vw, 5.2rem);
      font-weight: 950;
      letter-spacing: -.07em;
      line-height: 1;
      color: #ffe58f;
      text-shadow: 0 5px 0 #a2428f, 0 12px 35px #ff70ba7a;
      opacity: 0;
      transform: translateY(22px) scale(.5) rotate(-7deg);
      pointer-events: none;
    }

    .stage.popped .message {
      animation: message-in 700ms cubic-bezier(.17, .89, .32, 1.35) 180ms forwards;
    }

    button {
      margin-top: 4px;
      padding: 12px 22px;
      border: 1px solid #ffffff26;
      border-radius: 999px;
      background: #ffffff12;
      color: #fff8ff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover {
      background: #ffffff22;
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid #ffe58f;
      outline-offset: 4px;
    }

    @keyframes inflate {
      0% { transform: scale(.08); }
      45% { transform: scale(.64); }
      73% { transform: scale(.83); }
      88% { transform: scale(.78); }
      100% { transform: scale(1.15); }
    }

    @keyframes string-grow {
      to { transform: scaleY(1); }
    }

    @keyframes sway {
      from { rotate: -3deg; }
      to { rotate: 3deg; }
    }

    @keyframes pop {
      0% { opacity: .9; transform: scale(.1); }
      100% { opacity: 0; transform: scale(11); }
    }

    @keyframes confetti {
      0% { opacity: 1; translate: 0 0; rotate: 0; }
      100% {
        opacity: 0;
        translate: var(--x) var(--y);
        rotate: var(--turn);
      }
    }

    @keyframes message-in {
      0% { opacity: 0; transform: translateY(22px) scale(.5) rotate(-7deg); }
      70% { opacity: 1; transform: translateY(-5px) scale(1.08) rotate(2deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Una sorpresa está por llegar</h1>
    <p class="instruction" id="instruction">Mira cómo se infla...</p>
    <div class="stage" id="stage" aria-live="polite">
      <div class="balloon-wrap inflating" id="balloon-wrap" aria-hidden="true">
        <div class="balloon"></div>
        <div class="string"></div>
        <div class="pop-flash"></div>
        <div class="confetti" id="confetti"></div>
      </div>
      <div class="message" id="message" aria-hidden="true">CARE NALGA</div>
    </div>
    <button type="button" id="restart">Inflar otra vez</button>
  </main>

  <script>
    const balloonWrap = document.querySelector('#balloon-wrap');
    const stage = document.querySelector('#stage');
    const instruction = document.querySelector('#instruction');
    const message = document.querySelector('#message');
    const confetti = document.querySelector('#confetti');
    const colors = ['#ffe58f', '#8ce8ff', '#b99aff', '#ff70ba', '#9effbd'];
    let popTimer;

    function makeConfetti() {
      confetti.replaceChildren();
      for (let index = 0; index < 18; index += 1) {
        const piece = document.createElement('i');
        const angle = (Math.PI * 2 * index) / 18;
        const distance = 90 + (index % 4) * 20;
        piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
        piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
        piece.style.setProperty('--turn', `${index * 95}deg`);
        piece.style.setProperty('--delay', `${(index % 5) * 18}ms`);
        piece.style.setProperty('--color', colors[index % colors.length]);
        confetti.append(piece);
      }
    }

    function inflateBalloon() {
      window.clearTimeout(popTimer);
      balloonWrap.className = 'balloon-wrap inflating';
      stage.classList.remove('popped');
      message.setAttribute('aria-hidden', 'true');
      message.style.display = '';
      instruction.textContent = 'Mira cómo se infla...';
      makeConfetti();
      popTimer = window.setTimeout(() => {
        balloonWrap.className = 'balloon-wrap popped';
        stage.classList.add('popped');
        message.setAttribute('aria-hidden', 'false');
        instruction.textContent = '¡PUM! La sorpresa era...';
      }, 4300);
    }

    document.querySelector('#restart').addEventListener('click', inflateBalloon);
    inflateBalloon();
  </script>
</body>
</html>
